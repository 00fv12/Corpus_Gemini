[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gemini-corpus-ai"
version = "0.1.0"
description = "RAG en Python con Gemini, PDFs y PostgreSQL"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "google-genai",
  "pydantic-settings",
  "sqlalchemy",
  "psycopg[binary]",
  "pgvector",
  "pypdf",
  "reportlab",
]

[project.optional-dependencies]
api = ["fastapi", "uvicorn[standard]", "python-multipart"]
dev = ["pytest", "pytest-cov", "ruff", "mypy", "httpx"]

[tool.hatch.build.targets.wheel]
packages = ["src/corpus_ai"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "unit: Unit tests that test individual components with mocks",
    "integration: Integration tests that test multiple components together",
    "slow: Tests that take a long time to run",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true
